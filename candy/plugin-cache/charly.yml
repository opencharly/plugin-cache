plugin-cache:
    candy:
        description: |-
            The `charly cache` command — the git-ref cache operator surface, served as a
            charly COMMAND-class plugin (dual-placement: compiled-in + external). On
            `charly cache status|clear|refresh|bypass`, the plugin operates on the
            git-ref cache DIRECTLY through spec/refs (the same per-host charly.yml
            `cache:` section the core singleton uses — shared on-disk state). The
            bypass (`charly cache bypass`) is PERSISTED in the cache: git: section via
            refs.GitClient.SetBypass, so a fresh core process honors it at construction —
            the plugin owns the whole operator surface; core keeps only the mechanism
            (spec/refs) + the singleton. The command-class companion of the verb-class
            plugin-example-external; the command class is external-capable: charly
            prescans `cache` into the CLI grammar and dispatches it in-proc (compiled-in)
            or fork/execs this binary (external).

            The OCI-transport surface (`charly cache push <name> <ref>` / `pull`) moves
            a named spec/cache.ArtifactStore (an OCI Image Layout) to and from a
            registry, reaching candy/plugin-oci's verb:oci cache-push/cache-pull over
            the F10 peer-dispatch leg — the go-containerregistry transport stays
            single-homed in plugin-oci, never linked here. Needs the compiled-in
            placement (the reverse channel).

            `charly cache ingest <ref>` is the registry's WRITE half (charly#892): it
            fetches ONE remote ref through the same route and lands it in a named
            sdk/storekit store keyed by that ref — every blob content-addressed by
            digest, then the keyed entry (repo/tag and the D-STORE-5 resolution record
            in its annotations) LAST — so candy/plugin-registry's read-only server
            serves exactly what charly ingested. The store is the reserved `registry`
            name under the CACHE root (~/.cache/charly/registry, storekit's resolver),
            not spec/cache's config root. This is the ONE ingest route: `charly
            registry cache add` in opencharly/charly-registry is deleted with it (R2).
        plugin:
            providers:
                - command:cache
            source: github.com/opencharly/plugin-cache/candy/plugin-cache
        plan:
            - # ADE check: a deterministic build-context check that does NOT depend on the
              # project context the `charly cache` CLI needs (the prescan finds this candy
              # from the project dir). It mirrors candy/plugin-example-command's pattern — a
              # trivial build-context `command: true` check. The full CLI end-to-end
              # (`charly cache status` → the cache path + entry count on stdout) is exercised
              # by the Go e2e + the live R10.
              check: the cache command plugin ships a buildable Go module (go.mod + the provider main) the host can build + fork/exec; the full `charly cache` end-to-end is exercised by the Go e2e + the live R10
              id: cache-module-present
              context:
                - build
              command: "true"
            - # ADE check: the OCI-transport surface is present in the COMPILED charly
              # binary — a runtime-context `charly cache push --help` must exit 0 (the
              # plugin-agent precedent for asserting a command tree). The live registry
              # round-trip (push -> pull -> byte-identical read) is proven separately.
              check: the `charly cache push`/`pull` OCI-transport leaves are present in the compiled binary's command grammar (`charly cache push --help` exits 0)
              id: cache-oci-surface-present
              context:
                - runtime
              command: charly cache push --help
              exit_status: 0
            - # ADE check: the registry INGEST leaf is present in the COMPILED charly
              # binary — a runtime-context `charly cache ingest --help` must exit 0. The
              # live ingest (fetch -> store -> keyed entry, with the D-STORE-5 halves) is
              # proven by the Go tests and by the live run recorded on the PR.
              check: the `charly cache ingest` leaf is present in the compiled binary's command grammar (`charly cache ingest --help` exits 0)
              id: cache-registry-ingest-present
              context:
                - runtime
              command: charly cache ingest --help
              exit_status: 0

cache-skill:
    skill:
        name: cache
        family: cache
        owner: plugin-cache
        description: |-
            The `charly cache` git-ref cache operator surface — status, clear, refresh, bypass.
            Use before debugging stale @github ref resolution, a pin that will not advance, or
            a network-fetch that keeps returning an old answer.
        triggers:
            - "`charly cache` / git-ref cache / stale @github ref resolution / pinned ref won't advance"
